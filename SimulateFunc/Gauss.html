<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mô phỏng Khử Gauss</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; background: #f8fafc; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,.08); border-radius: 999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #64748b; border-radius: 999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: fade-in .25s ease-out forwards; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const eps = 1e-6;

    function deepCopyMatrix(m) {
      return m.map(row => row.slice());
    }

    function createRandomMatrix(n) {
      const m = Array.from({ length: n }, () =>
        Array.from({ length: n + 1 }, () => Math.floor(Math.random() * 19) - 9)
      );
      if (Math.random() > 0.55) m[0][0] = 0;
      return m;
    }

    function App() {
      const [n, setN] = useState(3);
      const [matrix, setMatrix] = useState([
        [0, 2, 1, 4],
        [1, 1, 2, 6],
        [2, 1, 1, 7],
      ]);
      const [initialMatrix, setInitialMatrix] = useState([
        [0, 2, 1, 4],
        [1, 1, 2, 6],
        [2, 1, 1, 7],
      ]);
      const [step, setStep] = useState({
        phase: "IDLE",
        i: 0,
        j: 0,
        k: 0,
        swapIdx: 0,
        m: 0,
        codeLine: -1,
      });
      const [logs, setLogs] = useState(["Hệ thống mô phỏng Khử Gauss đã sẵn sàng."]);
      const [history, setHistory] = useState([]);
      const [isPlaying, setIsPlaying] = useState(false);
      const [speed, setSpeed] = useState(1000);

      const matrixRef = useRef(matrix);
      const stepRef = useRef(step);
      const logsRef = useRef(logs);
      const historyRef = useRef(history);
      const timerRef = useRef(null);
      const logsEndRef = useRef(null);

      useEffect(() => { matrixRef.current = matrix; }, [matrix]);
      useEffect(() => { stepRef.current = step; }, [step]);
      useEffect(() => { logsRef.current = logs; }, [logs]);
      useEffect(() => { historyRef.current = history; }, [history]);

      useEffect(() => {
        if (logsEndRef.current) logsEndRef.current.scrollIntoView({ behavior: "smooth" });
      }, [logs]);

      function resetSim(currentN = n, currentMatrix = initialMatrix) {
        const m = deepCopyMatrix(currentMatrix);
        const nextStep = { phase: "IDLE", i: 0, j: 0, k: 0, swapIdx: 0, m: 0, codeLine: 0 };

        matrixRef.current = m;
        stepRef.current = nextStep;
        logsRef.current = ["Hệ thống mô phỏng Khử Gauss đã sẵn sàng."];
        historyRef.current = [];
        setMatrix(m);
        setStep(nextStep);
        setLogs(["Hệ thống mô phỏng Khử Gauss đã sẵn sàng."]);
        setHistory([]);
        setIsPlaying(false);
      }

      function generateRandomMatrix(size) {
        const m = createRandomMatrix(size);
        setN(size);
        setMatrix(deepCopyMatrix(m));
        setInitialMatrix(deepCopyMatrix(m));
        resetSim(size, m);
      }

      function handleNChange(val) {
        const newN = parseInt(val, 10);
        if (!Number.isFinite(newN) || newN < 2) return;
        generateRandomMatrix(newN);
      }

      function handleMatrixChange(r, c, val) {
        if (isPlaying || stepRef.current.phase !== "IDLE") return;
        const next = deepCopyMatrix(matrixRef.current);
        next[r][c] = val === "" ? 0 : (parseFloat(val) || 0);
        matrixRef.current = next;
        setMatrix(next);
        setInitialMatrix(deepCopyMatrix(next));
        resetSim(n, next);
      }

      function pushHistory() {
        const snap = {
          matrix: deepCopyMatrix(matrixRef.current),
          step: { ...stepRef.current },
          logs: [...logsRef.current],
        };
        historyRef.current = [...historyRef.current, snap];
        setHistory(historyRef.current);
      }

      function stepBack() {
        if (historyRef.current.length === 0 || isPlaying) return;
        const prev = historyRef.current[historyRef.current.length - 1];
        historyRef.current = historyRef.current.slice(0, -1);
        matrixRef.current = deepCopyMatrix(prev.matrix);
        stepRef.current = { ...prev.step };
        logsRef.current = [...prev.logs];
        setMatrix(deepCopyMatrix(prev.matrix));
        setStep({ ...prev.step });
        setLogs([...prev.logs]);
        setHistory(historyRef.current);
      }

      function nextStep() {
        if (stepRef.current.phase === "FINISHED") {
          setIsPlaying(false);
          return;
        }

        pushHistory();

        const currentMatrix = deepCopyMatrix(matrixRef.current);
        const currentStep = { ...stepRef.current };
        const newLogs = [...logsRef.current];

        let nextMatrix = currentMatrix;
        let nextStepState = { ...currentStep };

        switch (currentStep.phase) {
          case "IDLE":
            newLogs.push("Bắt đầu vòng lặp chính. i = 0");
            nextStepState = { ...currentStep, phase: "PIVOT_CHECK", i: 0, codeLine: 1 };
            break;

          case "PIVOT_CHECK":
            if (currentStep.i >= n - 1) {
              newLogs.push("Đã duyệt xong vòng lặp i. Ma trận đã ở dạng tam giác trên.");
              nextStepState = { ...currentStep, phase: "FINISHED", codeLine: -1 };
            } else if (Math.abs(currentMatrix[currentStep.i][currentStep.i]) < eps) {
              newLogs.push(`⚠️ a[${currentStep.i}][${currentStep.i}] ≈ 0. Cần tìm dòng để hoán vị.`);
              nextStepState = { ...currentStep, phase: "SWAP_SEARCH", swapIdx: currentStep.i + 1, codeLine: 2 };
            } else {
              newLogs.push(`a[${currentStep.i}][${currentStep.i}] hợp lệ. Bỏ qua bước hoán vị.`);
              nextStepState = { ...currentStep, phase: "ELIM_ROW_START", j: currentStep.i + 1, codeLine: 7 };
            }
            break;

          case "SWAP_SEARCH":
            if (currentStep.swapIdx < n) {
              if (Math.abs(currentMatrix[currentStep.swapIdx][currentStep.i]) > eps) {
                newLogs.push(`Tìm thấy a[${currentStep.swapIdx}][${currentStep.i}] = ${currentMatrix[currentStep.swapIdx][currentStep.i]}. Sẽ hoán vị.`);
                nextStepState = { ...currentStep, phase: "SWAPPING", codeLine: 4 };
              } else {
                newLogs.push(`a[${currentStep.swapIdx}][${currentStep.i}] cũng ≈ 0. Tiếp tục tìm kiếm.`);
                nextStepState = { ...currentStep, phase: "SWAP_SEARCH", swapIdx: currentStep.swapIdx + 1, codeLine: 3 };
              }
            } else {
              newLogs.push(`Không tìm thấy dòng nào để hoán vị. Cột ${currentStep.i} toàn số 0 ở phía dưới.`);
              nextStepState = { ...currentStep, phase: "POST_SWAP_CHECK", codeLine: 6 };
            }
            break;

          case "SWAPPING": {
            const i = currentStep.i;
            const s = currentStep.swapIdx;
            const temp = nextMatrix[i];
            nextMatrix[i] = nextMatrix[s];
            nextMatrix[s] = temp;
            newLogs.push(`Đã đổi chỗ dòng ${i} và dòng ${s}.`);
            nextStepState = { ...currentStep, phase: "POST_SWAP_CHECK", codeLine: 5 };
            break;
          }

          case "POST_SWAP_CHECK":
            if (Math.abs(currentMatrix[currentStep.i][currentStep.i]) < eps) {
              newLogs.push(`Bỏ qua cột ${currentStep.i} vì phần tử trục vẫn bằng 0 (hệ suy biến).`);
              nextStepState = { ...currentStep, phase: "PIVOT_CHECK", i: currentStep.i + 1, codeLine: 6 };
            } else {
              nextStepState = { ...currentStep, phase: "ELIM_ROW_START", j: currentStep.i + 1, codeLine: 7 };
            }
            break;

          case "ELIM_ROW_START":
            if (currentStep.j < n) {
              const m = -currentMatrix[currentStep.j][currentStep.i] / currentMatrix[currentStep.i][currentStep.i];
              newLogs.push(`Xét dòng j = ${currentStep.j}. Hệ số m = ${m.toFixed(4)}`);
              nextStepState = { ...currentStep, phase: "ELIM_CALC", m, k: currentStep.i, codeLine: 8 };
            } else {
              newLogs.push(`Đã khử xong các dòng dưới dòng ${currentStep.i}. Tăng i.`);
              nextStepState = { ...currentStep, phase: "PIVOT_CHECK", i: currentStep.i + 1, codeLine: 1 };
            }
            break;

          case "ELIM_CALC":
            if (currentStep.k <= n) {
              const j = currentStep.j;
              const i = currentStep.i;
              const k = currentStep.k;
              const oldVal = currentMatrix[j][k];
              const newVal = oldVal + currentStep.m * currentMatrix[i][k];
              nextMatrix[j] = [...nextMatrix[j]];
              nextMatrix[j][k] = Math.abs(newVal) < eps ? 0 : newVal;
              newLogs.push(`Col k=${k}: a[${j}][${k}] = ${oldVal.toFixed(2)} + (${currentStep.m.toFixed(2)} × ${currentMatrix[i][k].toFixed(2)}) = ${nextMatrix[j][k].toFixed(2)}`);
              nextStepState = { ...currentStep, k: currentStep.k + 1, codeLine: 10 };
            } else {
              newLogs.push(`Đã cập nhật xong dòng ${currentStep.j}.`);
              nextStepState = { ...currentStep, phase: "ELIM_ROW_START", j: currentStep.j + 1, codeLine: 7 };
            }
            break;

          case "FINISHED":
            setIsPlaying(false);
            return;

          default:
            break;
        }

        matrixRef.current = nextMatrix;
        stepRef.current = nextStepState;
        logsRef.current = newLogs;

        setMatrix(nextMatrix);
        setStep(nextStepState);
        setLogs(newLogs);
      }

      useEffect(() => {
        if (!isPlaying) {
          clearInterval(timerRef.current);
          return;
        }
        timerRef.current = setInterval(() => {
          nextStep();
        }, speed);
        return () => clearInterval(timerRef.current);
      }, [isPlaying, speed]);

      useEffect(() => {
        if (step.phase === "FINISHED") setIsPlaying(false);
      }, [step.phase]);

      const getCellClassName = (r, c) => {
        const base = "w-full text-center p-3 rounded-xl border-2 font-mono text-lg transition-all duration-300";
        const { phase, i, j, k, swapIdx } = step;

        if (phase === "FINISHED") return `${base} border-emerald-200 bg-emerald-50 text-emerald-900`;
        if (r === i && c === i) return `${base} border-amber-500 bg-amber-100 ring-4 ring-amber-200 shadow-lg font-black z-10 relative`;
        if (phase === "SWAP_SEARCH" && r === swapIdx && c === i) return `${base} border-rose-500 bg-rose-100 animate-pulse`;
        if (phase === "SWAPPING" && (r === i || r === swapIdx)) return `${base} border-blue-400 bg-blue-100 text-blue-900`;
        if (phase === "ELIM_CALC") {
          if (r === j && c === k) return `${base} border-emerald-500 bg-emerald-200 ring-2 ring-emerald-300 scale-105 shadow-md relative z-10`;
          if (r === i && c === k) return `${base} border-cyan-400 bg-cyan-100`;
          if (r === j) return `${base} border-emerald-200 bg-emerald-50/60`;
        }
        if (r > c && Math.abs(matrix[r][c]) < eps) return `${base} border-slate-100 bg-slate-50 text-slate-300`;
        return `${base} border-slate-200 bg-white focus:border-indigo-400`;
      };

      const codeLines = [
        "void gauss(double a[][11], int n) {",
        "  for (int i = 0; i < n - 1; i++) {",
        "    if (fabs(a[i][i]) < eps) {",
        "      for (int k = i + 1; k < n; k++) {",
        "        if (fabs(a[k][i]) > eps) {",
        "          doidong(a, n, i, k); break;",
        "        }",
        "      }",
        "    }",
        "    if (fabs(a[i][i]) < eps) continue;",
        "    for (int j = i + 1; j < n; j++) {",
        "      double m = -a[j][i] / a[i][i];",
        "      for (int k = i; k <= n; k++) {",
        "        a[j][k] = a[j][k] + m * a[i][k];",
        "      }",
        "    }",
        "  }",
        "}",
      ];

      return (
        <div className="min-h-screen bg-slate-50 p-4 md:p-8 font-sans text-slate-900">
          <div className="max-w-7xl mx-auto space-y-6">
            <div className="bg-white rounded-3xl shadow-sm p-6 border border-slate-200 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
              <div>
                <h1 className="text-3xl font-black text-indigo-900 flex items-center gap-3">
                  <span className="text-indigo-600">▣</span>
                  Trực quan hóa Thuật toán Khử Gauss
                </h1>
                <p className="text-slate-500 mt-2 text-lg">
                  Mô phỏng chi tiết từng bước đưa ma trận mở rộng về dạng tam giác trên.
                </p>
              </div>

              <div className="px-6 py-3 rounded-2xl bg-indigo-50 border border-indigo-100 flex items-center gap-3 shadow-inner">
                <div className={`w-3 h-3 rounded-full ${step.phase === "FINISHED" ? "bg-emerald-500" : isPlaying ? "bg-amber-500 animate-pulse" : "bg-indigo-500"}`}></div>
                <span className="font-bold text-indigo-900 uppercase tracking-wider text-sm">
                  Trạng thái: {step.phase.replace(/_/g, " ")}
                </span>
              </div>
            </div>

            <div className="grid grid-cols-1 xl:grid-cols-12 gap-6">
              <div className="xl:col-span-7 space-y-6 flex flex-col">
                <div className="bg-white rounded-3xl shadow-sm p-6 border border-slate-200">
                  <div className="flex flex-wrap items-center gap-6 mb-6 pb-6 border-b border-slate-100">
                    <div className="flex items-center gap-3 bg-slate-50 px-4 py-2 rounded-xl border border-slate-200">
                      <span className="font-bold text-slate-700">Dimension n:</span>
                      <div className="flex gap-1">
                        {[2, 3, 4, 5].map(v => (
                          <button
                            key={v}
                            onClick={() => handleNChange(v)}
                            className={`w-8 h-8 rounded-lg font-bold text-sm transition-all ${n === v ? "bg-indigo-600 text-white shadow-md" : "bg-white hover:bg-slate-200 text-slate-600"}`}
                          >
                            {v}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="flex items-center gap-3 bg-slate-50 px-4 py-2 rounded-xl border border-slate-200">
                      <span className="font-bold text-slate-700">Speed:</span>
                      <input
                        type="range"
                        min="100"
                        max="2000"
                        step="100"
                        value={2100 - speed}
                        onChange={(e) => setSpeed(2100 - parseInt(e.target.value, 10))}
                        className="w-24 accent-indigo-600"
                      />
                    </div>

                    <button
                      onClick={() => generateRandomMatrix(n)}
                      className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-colors border border-slate-200 text-sm"
                    >
                      Tạo ma trận ngẫu nhiên
                    </button>
                  </div>

                  <div className="flex gap-3 flex-wrap">
                    <button
                      onClick={() => resetSim()}
                      className="flex flex-col items-center justify-center flex-1 min-w-[120px] py-3 bg-slate-100 hover:bg-slate-200 rounded-2xl font-bold transition-all text-slate-700 border border-slate-200"
                    >
                      Renew
                    </button>

                    <button
                      onClick={stepBack}
                      disabled={history.length === 0 || isPlaying}
                      className="flex flex-col items-center justify-center flex-1 min-w-[120px] py-3 bg-slate-100 hover:bg-slate-200 disabled:opacity-50 disabled:hover:bg-slate-100 rounded-2xl font-bold transition-all text-slate-700 border border-slate-200"
                    >
                      Previous
                    </button>

                    <button
                      onClick={() => setIsPlaying(!isPlaying)}
                      disabled={step.phase === "FINISHED"}
                      className={`flex flex-col items-center justify-center flex-[2] min-w-[170px] py-3 rounded-2xl font-black text-white shadow-lg transition-all disabled:opacity-50 ${isPlaying ? "bg-rose-500 hover:bg-rose-600" : "bg-indigo-600 hover:bg-indigo-700"}`}
                    >
                      {isPlaying ? "TẠM DỪNG" : "Auto Operate"}
                    </button>

                    <button
                      onClick={nextStep}
                      disabled={step.phase === "FINISHED" || isPlaying}
                      className="flex flex-col items-center justify-center flex-[2] min-w-[170px] py-3 bg-emerald-500 hover:bg-emerald-600 disabled:opacity-50 text-white rounded-2xl font-black shadow-lg transition-all border-b-4 border-emerald-700 active:border-b-0 active:translate-y-1"
                    >
                      Next Step
                    </button>
                  </div>
                </div>

                <div className="bg-white rounded-3xl shadow-sm p-6 border border-slate-200 flex-1 flex flex-col">
                  <h3 className="font-bold text-slate-800 mb-6 flex items-center gap-2 border-b border-slate-100 pb-4">
                    Bảng Ma trận Mở rộng
                  </h3>
                  <div className="overflow-x-auto flex-1 flex items-center justify-center">
                    <table className="border-separate border-spacing-3 w-full max-w-2xl">
                      <thead>
                        <tr>
                          {Array.from({ length: n }).map((_, i) => (
                            <th key={i} className="text-center text-slate-400 font-mono text-sm uppercase pb-2">Col {i}</th>
                          ))}
                          <th className="w-8"></th>
                          <th className="text-center text-indigo-500 font-mono text-sm uppercase pb-2 bg-indigo-50 rounded-lg">Vế phải</th>
                        </tr>
                      </thead>
                      <tbody>
                        {matrix.map((row, r) => (
                          <tr key={r}>
                            {row.map((cell, c) => (
                              <React.Fragment key={c}>
                                {c === n && (
                                  <td className="text-center font-black text-slate-300 text-3xl">|</td>
                                )}
                                <td>
                                  <input
                                    type="number"
                                    value={Number.isInteger(cell) ? cell : Number(cell).toFixed(2)}
                                    onChange={(e) => handleMatrixChange(r, c, e.target.value)}
                                    disabled={isPlaying || step.phase !== "IDLE"}
                                    className={getCellClassName(r, c)}
                                  />
                                </td>
                              </React.Fragment>
                            ))}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>

              <div className="xl:col-span-5 flex flex-col gap-6">
                <div className="bg-gradient-to-br from-indigo-900 to-slate-900 rounded-3xl shadow-xl p-6 text-white border border-indigo-800">
                  <div className="flex items-center gap-3 mb-4">
                    <div className="p-2 bg-indigo-500/30 rounded-xl">i</div>
                    <h3 className="text-lg font-bold text-indigo-100">Current Mathematical Details</h3>
                  </div>

                  <div className="bg-black/30 rounded-2xl p-5 border border-white/5 min-h-[160px] flex flex-col justify-center">
                    {step.phase === "IDLE" && (
                      <p className="text-slate-400 text-center italic">Nhấn "BƯỚC TIẾP TỤC" để bắt đầu thuật toán.</p>
                    )}

                    {step.phase === "PIVOT_CHECK" && (
                      <div className="space-y-2 text-center">
                        <p className="text-indigo-300 text-sm font-bold uppercase tracking-widest">Kiểm tra Phần tử Trục</p>
                        <div className="text-2xl font-mono">
                          a<sub>{step.i}{step.i}</sub> = <span className="text-amber-400 font-black">{matrix[step.i]?.[step.i] ?? 0}</span>
                        </div>
                      </div>
                    )}

                    {step.phase === "SWAPPING" && (
                      <div className="space-y-2 text-center">
                        <p className="text-indigo-300 text-sm font-bold uppercase tracking-widest">Hoán vị Dòng</p>
                        <div className="text-2xl font-mono text-blue-300">
                          R<sub>{step.i}</sub> ↔ R<sub>{step.swapIdx}</sub>
                        </div>
                      </div>
                    )}

                    {step.phase === "ELIM_ROW_START" && (
                      <div className="space-y-3 text-center">
                        <p className="text-emerald-400 text-sm font-bold uppercase tracking-widest">Tính Hệ số Nhân</p>
                        <div className="bg-white/10 p-3 rounded-xl inline-block mx-auto border border-white/20">
                          <div className="text-xl font-mono">
                            m = - a<sub>{step.j}{step.i}</sub> / a<sub>{step.i}{step.i}</sub>
                          </div>
                          <div className="mt-2 text-emerald-300 font-bold">
                            = {matrix[step.j]?.[step.i] ?? 0} / {matrix[step.i]?.[step.i] ?? 1}
                            {" "}→ {Number.isFinite(step.m) ? step.m.toFixed(3) : "0.000"}
                          </div>
                        </div>
                      </div>
                    )}

                    {step.phase === "ELIM_CALC" && (
                      <div className="space-y-3 text-center">
                        <p className="text-emerald-400 text-sm font-bold uppercase tracking-widest">Cập nhật Ô Ma trận</p>
                        <div className="bg-emerald-900/40 p-4 rounded-xl border border-emerald-500/30 font-mono">
                          <div className="text-lg text-emerald-100">
                            a<sub>{step.j}{step.k}</sub> = a<sub>{step.j}{step.k}</sub> + m × a<sub>{step.i}{step.k}</sub>
                          </div>
                        </div>
                      </div>
                    )}

                    {step.phase === "FINISHED" && (
                      <div className="text-center space-y-2">
                        <div className="mx-auto text-emerald-400 w-12 h-12 mb-2 text-4xl">✓</div>
                        <p className="text-emerald-300 font-bold text-xl">Hoàn thành Khử Gauss!</p>
                        <p className="text-slate-300 text-sm">
                          Ma trận đã được biến đổi thành ma trận tam giác trên.
                        </p>
                      </div>
                    )}
                  </div>
                </div>

                <div className="bg-[#1E1E1E] rounded-3xl shadow-xl overflow-hidden border border-slate-700 flex flex-col">
                  <div className="bg-[#2D2D2D] px-4 py-3 border-b border-slate-700 flex items-center gap-2">
                    <h3 className="font-bold text-slate-200 text-sm tracking-wider">C++ CODE TRACKER</h3>
                  </div>
                  <div className="p-4 font-mono text-sm overflow-y-auto space-y-1 custom-scrollbar max-h-[320px]">
                    {codeLines.map((line, idx) => (
                      <div
                        key={idx}
                        className={`px-2 py-1 rounded transition-colors duration-200 flex gap-4 ${step.codeLine === idx ? "bg-indigo-500/30 text-indigo-200 border-l-4 border-indigo-500" : "text-slate-400 hover:bg-white/5 border-l-4 border-transparent"}`}
                      >
                        <span className="text-slate-600 select-none w-6 text-right">{idx}</span>
                        <pre className="whitespace-pre flex-1">{line}</pre>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-[#0f172a] rounded-3xl shadow-xl p-5 border border-slate-700 flex flex-col h-[250px]">
                  <div className="flex items-center gap-2 mb-3 border-b border-slate-800 pb-3 text-xs text-slate-400 font-bold tracking-widest">
                    <div className="w-3 h-3 rounded-full bg-red-500"></div>
                    <div className="w-3 h-3 rounded-full bg-amber-500"></div>
                    <div className="w-3 h-3 rounded-full bg-emerald-500"></div>
                    <span className="ml-2">EXECUTION LOGS</span>
                  </div>
                  <div className="flex-1 overflow-y-auto space-y-2 pr-2 custom-scrollbar font-mono text-sm">
                    {logs.map((log, idx) => (
                      <div key={idx} className="animate-in fade-in">
                        <span className="text-slate-600 mr-3">[{idx.toString().padStart(3, "0")}]</span>
                        <span className={`${log.includes("⚠️") ? "text-amber-400" : log.includes("Đã") || log.includes("Hoàn thành") ? "text-emerald-400" : "text-slate-300"}`}>
                          {log}
                        </span>
                      </div>
                    ))}
                    <div ref={logsEndRef} />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
